<svg xmlns="http://www.w3.org/2000/svg" width="420" height="195" viewBox="0 0 420 195" role="img" aria-label="Estadísticas de GitHub"><title>Estadísticas de GitHub</title><style>.fade{opacity:0;animation:fade .45s ease-out forwards}.pop{opacity:0;animation:fade .3s ease-out forwards}.type{animation:type var(--d) steps(var(--n)) forwards}.blink{animation:blink 1.1s steps(1) infinite}.grow{transform-origin:var(--o);animation:grow .9s cubic-bezier(.2,.8,.2,1) forwards;transform:scale(0)}@keyframes fade{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}@keyframes type{to{transform:translateX(var(--w))}}@keyframes blink{50%{fill-opacity:0}}@keyframes grow{to{transform:scale(1)}}@media (prefers-reduced-motion:reduce){.fade,.pop,.grow{animation:none;opacity:1;transform:none}.type{display:none}.blink{animation:none}}</style><rect x=".5" y=".5" width="419" height="194" rx="10" fill="#ffffff" stroke="#d0d7de"/><text x="24" y="36" font-family="'JetBrains Mono','Fira Code','SF Mono',Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="14" font-weight="600"><tspan fill="#1a7f37">$</tspan> <tspan fill="#1f2328">git log --stats</tspan></text><text x="396" y="36" text-anchor="end" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" fill="#656d76">últimos 12 meses</text><g class="fade" style="animation-delay:0.15s"><text x="24" y="94" font-family="'JetBrains Mono','Fira Code','SF Mono',Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="26" font-weight="700" fill="#1a7f37">137</text><text x="24" y="114" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" fill="#656d76">contribuciones</text></g><g class="fade" style="animation-delay:0.22s"><text x="156" y="94" font-family="'JetBrains Mono','Fira Code','SF Mono',Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="26" font-weight="700" fill="#1f2328">123</text><text x="156" y="114" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" fill="#656d76">commits</text></g><g class="fade" style="animation-delay:0.29s"><text x="288" y="94" font-family="'JetBrains Mono','Fira Code','SF Mono',Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="26" font-weight="700" fill="#1f2328">39</text><text x="288" y="114" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" fill="#656d76">días activos</text></g><g class="fade" style="animation-delay:0.36s"><text x="24" y="156" font-family="'JetBrains Mono','Fira Code','SF Mono',Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="26" font-weight="700" fill="#1f2328">1d</text><text x="24" y="176" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" fill="#656d76">racha actual</text></g><g class="fade" style="animation-delay:0.43s"><text x="156" y="156" font-family="'JetBrains Mono','Fira Code','SF Mono',Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="26" font-weight="700" fill="#1f2328">5d</text><text x="156" y="176" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" fill="#656d76">racha más larga</text></g><g class="fade" style="animation-delay:0.50s"><text x="288" y="156" font-family="'JetBrains Mono','Fira Code','SF Mono',Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="26" font-weight="700" fill="#1f2328">30</text><text x="288" y="176" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" fill="#656d76">repositorios</text></g></svg>
