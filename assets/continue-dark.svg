<svg xmlns="http://www.w3.org/2000/svg" width="420" height="150" viewBox="0 0 420 150" role="img" aria-label="CONTINUE? PRESS START: abre el portafolio"><title>CONTINUE? PRESS START: abre el portafolio</title><style>@font-face{font-family:'PressStart2P';src:url(data:font/ttf;base64,) format('truetype')}.bar{transform:scaleX(0);animation:bar 1.2s cubic-bezier(.2,.8,.2,1) forwards}@keyframes bar{to{transform:scaleX(1)}}.bl{animation:bl 1s steps(1) infinite}@keyframes bl{50%{opacity:0}}.spin{animation:spin 3s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}.eq{animation:eq .9s ease-in-out infinite alternate}@keyframes eq{from{transform:scaleY(.2)}to{transform:scaleY(1)}}@media (prefers-reduced-motion:reduce){.bar{animation:none;transform:none}.bl,.spin,.eq{animation:none}}.cd{opacity:0;animation:cd 10s steps(1) infinite}@keyframes cd{0%{opacity:1}10%{opacity:0}}@media (prefers-reduced-motion:reduce){.cd{animation:none}.cd:last-of-type{opacity:1}}</style><defs><pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse"><rect width="4" height="2" fill="#000" fill-opacity=".25"/></pattern></defs><rect x=".5" y=".5" width="419" height="149" rx="10" fill="#050a06" stroke="#3fb950" stroke-opacity=".6"/><text x="210" y="42" font-family="'PressStart2P',monospace" font-size="16" fill="#ffbd2e" text-anchor="middle">CONTINUE?</text><text class="cd" style="animation-delay:9s" x="210.0" y="104" font-family="'PressStart2P',monospace" font-size="40" fill="#e6edf3" text-anchor="middle">0</text><text class="cd" style="animation-delay:8s" x="210.0" y="104" font-family="'PressStart2P',monospace" font-size="40" fill="#e6edf3" text-anchor="middle">1</text><text class="cd" style="animation-delay:7s" x="210.0" y="104" font-family="'PressStart2P',monospace" font-size="40" fill="#e6edf3" text-anchor="middle">2</text><text class="cd" style="animation-delay:6s" x="210.0" y="104" font-family="'PressStart2P',monospace" font-size="40" fill="#e6edf3" text-anchor="middle">3</text><text class="cd" style="animation-delay:5s" x="210.0" y="104" font-family="'PressStart2P',monospace" font-size="40" fill="#e6edf3" text-anchor="middle">4</text><text class="cd" style="animation-delay:4s" x="210.0" y="104" font-family="'PressStart2P',monospace" font-size="40" fill="#e6edf3" text-anchor="middle">5</text><text class="cd" style="animation-delay:3s" x="210.0" y="104" font-family="'PressStart2P',monospace" font-size="40" fill="#e6edf3" text-anchor="middle">6</text><text class="cd" style="animation-delay:2s" x="210.0" y="104" font-family="'PressStart2P',monospace" font-size="40" fill="#e6edf3" text-anchor="middle">7</text><text class="cd" style="animation-delay:1s" x="210.0" y="104" font-family="'PressStart2P',monospace" font-size="40" fill="#e6edf3" text-anchor="middle">8</text><text class="cd" style="animation-delay:0s" x="210.0" y="104" font-family="'PressStart2P',monospace" font-size="40" fill="#e6edf3" text-anchor="middle">9</text><g class="bl"><text x="210" y="134" font-family="'PressStart2P',monospace" font-size="10" fill="#39d353" text-anchor="middle">PRESS START</text></g><text x="404" y="24" font-family="'PressStart2P',monospace" font-size="7" fill="#8b949e" text-anchor="end">CREDITS 01</text><rect x="0" y="0" width="420" height="150" rx="10" fill="url(#scan)"/></svg>
