name: Perfil

on:
  schedule:
    # cada 12 horas
    - cron: "17 */12 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - assets/profile.json
      - scripts/**
      - .github/workflows/profile.yml

permissions:
  contents: write

concurrency:
  group: perfil
  cancel-in-progress: true

jobs:
  generar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generar SVGs
        run: python scripts/generate.py
        env:
          # PROFILE_TOKEN (PAT con read:user) cuenta también tus contribuciones privadas.
          # Sin él, GITHUB_TOKEN solo ve actividad pública.
          GH_TOKEN: ${{ secrets.PROFILE_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Commit si hay cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets
          if git diff --cached --quiet; then
            echo "Sin cambios."
          else
            git commit -m "chore: actualizar imágenes del perfil"
            git push
          fi
